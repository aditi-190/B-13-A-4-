<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Job Application Tracker</title>
      <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    
    <main class="container">

       
        <h1>Job Application Tracker</h1>

        <section class="dashboard">

        
            <div class="dashboard-card">
                <h3>Total</h3>
                <p id="total-count">0</p>
            </div>

        
            <div class="dashboard-card">
                <h3>Interview</h3>
                <p id="interview-count">0</p>
            </div>

       
            <div class="dashboard-card">
                <h3>Rejected</h3>
                <p id="rejected-count">0</p>
            </div>

        </section>

          <section class="jobs-section">

            <div class="section-header">

                <h2>Available Jobs</h2>

          
                <p>
                    <span id="job-count">0</span> jobs
                </p>

            </div>


         
            <div class="tabs">

                <button class="tab active" id="all-tab">
                    All
                </button>

                <button class="tab" id="interview-tab">
                    Interview
                </button>

                <button class="tab" id="rejected-tab">
                    Rejected
                </button>

            </div>


          
            <div id="jobs-container">

               

            </div>


           
            <div id="no-jobs" class="no-jobs">

              <i class="fa-regular fa-file-lines"></i>

                <h3>No jobs available</h3>

                <p>
                    Check back soon for new job opportunities.
                </p>

            </div>

        </section>

    </main>


  
    <script src="script.js"></script>

</body>

</html>
